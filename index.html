<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8">
<!-- 영어 연습 — 폰 앱 껍데기 (2026-10-21 · 껍데기판 1 · 29번 나만의 유튜브 껍데기를 본뜸)
     하는 일 : 폰에 «앱» 으로 설치되게 이름 · 아이콘 · 꽉 찬 화면(manifest)을 알려 주고, 안에 구글 앱스 스크립트 화면을 통째로 띄운다.
     이 껍데기에는 자료가 하나도 없다 — 단어 · 문장 · 설정은 모두 구글 시트에, 열리는 것은 주인 구글 계정으로 로그인했을 때뿐 («나만» 배포).
     화면이 «떴음» 신호(postMessage)를 20초 안에 안 보내면 → 구글 로그인이 이 안에서 안 통하는 것으로 보고 «바로 열기» 단추를 보인다. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d1d1f">
<meta name="껍데기판" content="1">
<title>영어 연습</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="영어 연습">
<style>
  :root{--bg:#dde1e6;--ink:#1f2328;--dim:#545d68;--btn:#3f7300;--on:#fff;--card:#f2f4f6}
  @media (prefers-color-scheme:dark){:root{--bg:#0d0f12;--ink:#e6e9ed;--dim:#a3abb5;--btn:#e8743b;--on:#000;--card:#1c1f24}}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
  #덮개{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);text-align:center;padding:24px;transition:opacity .25s}
  #덮개.걷힘{opacity:0;pointer-events:none}
  #덮개 img{width:96px;height:96px}
  #덮개 b{font-size:18px}
  #덮개 .곁{font-size:14px;color:var(--dim);max-width:320px;line-height:1.5}
  #막힘{display:none;flex-direction:column;gap:10px;align-items:center}
  #막힘.보임{display:flex}
  .단추{border:0;border-radius:12px;padding:12px 20px;min-height:48px;font-size:16px;font-weight:700;background:var(--btn);color:var(--on);text-decoration:none;box-sizing:border-box}
  .단추.옅게{background:var(--card);color:var(--ink)}
  .서명{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:13px;color:var(--dim)}
</style>
</head>
<body>
<iframe id="앱" title="영어 연습" allow="autoplay; clipboard-write"></iframe>
<div id="덮개">
  <img src="icons/icon-192.png" alt="">
  <b>영어 연습</b>
  <div class="곁" id="말">여는 중…</div>
  <div id="막힘">
    <div class="곁">이 안에서 구글 로그인이 안 통함 → 아래 «바로 열기» 로 엶 (위에 얇은 주소 줄이 생김)</div>
    <a class="단추" id="바로">바로 열기</a>
    <button class="단추 옅게" id="다시">다시 시도</button>
  </div>
  <div class="서명">DSM · 32 영어 연습 · 껍데기판 1</div>
</div>
<script>
// 구글 앱스 스크립트 화면 주소 — 배포 뒤 한 번 적음 · 그 뒤로는 «배포 관리 → 새 버전» 으로만 올려 주소가 안 바뀜
const 진짜주소 = 'https://script.google.com/macros/s/AKfycbxsArVDAgNFxliE-UsZxNynIVX16X-GEWF0viVfFfs9tC5BNAOKRd1RSXPBQYC-fHvcBA/exec';
// 시험용 — 이 PC 에서 열 때(file · localhost)만 ?화면=주소 로 시험 화면을 끼울 수 있다. 깃허브에서는 늘 진짜 주소
const 이PC = location.protocol === 'file:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
const 화면주소 = (이PC && new URLSearchParams(location.search).get('화면')) || 진짜주소;
const 기다림초 = 20;

const 앱 = document.getElementById('앱'), 덮개 = document.getElementById('덮개');
document.getElementById('바로').href = 화면주소;
let 떴음 = false, 시계 = null;

function 열기() {
  떴음 = false;
  덮개.classList.remove('걷힘');
  document.getElementById('막힘').classList.remove('보임');
  document.getElementById('말').textContent = '여는 중…';
  앱.src = 화면주소;
  clearTimeout(시계);
  시계 = setTimeout(() => {
    if (떴음) return;
    document.getElementById('말').textContent = 기다림초 + '초 기다려도 안 뜸';
    document.getElementById('막힘').classList.add('보임');
  }, 기다림초 * 1000);
}

// 화면(index.html)이 보내는 신호 — {영어연습: '떴음' | '못받음', 판}
window.addEventListener('message', e => {
  const 글 = e.data && e.data.영어연습;
  if (!글) return;
  떴음 = true;
  clearTimeout(시계);
  덮개.classList.add('걷힘');             // '못받음' 이어도 걷는다 — 화면이 스스로 까닭 글을 보여 줌
});

document.getElementById('다시').addEventListener('click', 열기);
열기();

// 설치(앱) 조건을 맞추려는 작은 일꾼 — 아무것도 담아 두지 않음 (sw.js)
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body></html>
